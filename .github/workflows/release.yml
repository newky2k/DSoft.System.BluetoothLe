# Release: on every push to master, builds Release and pushes the DSoft.*.nupkg
# package (with its .snupkg symbols) to nuget.org as 4.0.yyMM.<run number>, then
# tags the commit and creates a GitHub release with the package attached.
# RELEASE_SUFFIX is empty for a stable version; set it to a suffix such as
# '-prerelease' to publish a prerelease.
# Signs in to nuget.org with Trusted Publishing (OIDC), so no API key is stored.
name: Release

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASE_SUFFIX: ''

jobs:
  release:
    runs-on: windows-latest
    environment: nuget
    permissions:
      contents: write # GitHub release and tag
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Version
        id: version
        shell: bash
        run: |
          version="4.0.$(date -u +%y%m).${{ github.run_number }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package=$version$RELEASE_SUFFIX" >> "$GITHUB_OUTPUT"
          echo "Version: $version$RELEASE_SUFFIX"

      - name: Restore workloads
        run: dotnet workload restore DSoft.System.BluetoothLe/DSoft.System.BluetoothLe.csproj

      - name: Restore
        run: dotnet restore DSoft.System.BluetoothLe.slnx

      # AssemblyVersion is deliberately not overridden. It is pinned in the csproj, because a strong-named
      # assembly whose identity moves on every CI build forces consumers on net481 to carry a binding
      # redirect. FileVersion still carries the build number, which is what a support engineer reads off
      # a shipped file.
      - name: Build
        run: >
          dotnet build DSoft.System.BluetoothLe.slnx --configuration Release --no-restore
          /p:Version=${{ steps.version.outputs.package }}
          /p:FileVersion=${{ steps.version.outputs.version }}

      - name: Collect packages
        shell: bash
        run: |
          mkdir -p artifacts
          find DSoft.System.BluetoothLe -path '*/bin/Release/*' \( -name 'DSoft.*.nupkg' -o -name 'DSoft.*.snupkg' \) -exec cp {} artifacts/ \;
          ls artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: drop
          path: artifacts/*

      - name: NuGet login
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # The .snupkg next to each .nupkg is pushed with it.
      - name: Push to nuget.org
        shell: bash
        run: |
          for package in artifacts/*.nupkg; do
            dotnet nuget push "$package" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      - name: GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.package }}" artifacts/*.nupkg \
            --target "${{ github.sha }}" \
            --title "${{ steps.version.outputs.package }}" \
            --generate-notes \
            ${RELEASE_SUFFIX:+--prerelease}
